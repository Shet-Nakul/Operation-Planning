version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: hospital_scheduling
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    restart: always
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/hospital_scheduling?schema=public"
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: super_secret_access_token_key
      JWT_REFRESH_SECRET: super_secret_refresh_token_key
      JWT_ACCESS_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
volumes:
  postgres_data:
